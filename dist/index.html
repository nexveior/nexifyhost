    <script>
      /* Auto theme: apply before first paint to avoid a flash.
         Stored choice wins; otherwise follow the OS preference. */
      (function () {
        try {
          var t = localStorage.getItem("nexify-theme");
          var dark = t
            ? t === "dark"
            : !window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();

:"shield",title:"Free DDoS Protection",description:"Minecraft-aware filtering absorbs attacks at the edge so your players never get kicked — always on, always included, no configuration needed.",wide:!0},{icon:"plug",title:"1-Click Plugins & Mods",description:"Install from thousands of plugins, mods and full modpacks straight from the panel."},{icon:"archive",title:"Automatic Backups",description:"Scheduled offsite backups with one-click restore keep every world safe."},{icon:"settings",title:"Full Panel Control",description:"File manager, console, schedulers, sub-users and version switching — all included."},{icon:"chart",title:"Instant Upgrades",description:"Add RAM or CPU as your community grows — applied instantly, no world migration."}]},Ns={badge:"Our Panel",subtitle:"A custom-built control panel that puts every tool one click away.",cards:[{icon:"terminal",title:"Shell Access",description:"Manage your server directly through our own custom shell — no third-party tools required."},{icon:"plug",title:"Plugin Manager",description:"Browse and install thousands of Spigot & Paper plugins with a single click."},{icon:"archive",title:"Modpack Manager",description:"One-click Forge, Fabric and CurseForge modpack installs with automatic version handling."},{icon:"heart",title:"TPS Analytics",description:"Live TPS, RAM, CPU and player charts with detailed historical logs."}]},fr={badge:"Network",subtitle:"Anycast edge points across five continents keep ping low no matter where your players connect from.",markers:[{name:"New York",lat:40.71,lng:-74},{name:"São Paulo",lat:-23.55,lng:-46.63},{name:"Mexico City",lat:19.43,lng:-99.13},{name:"Istanbul",lat:41,lng:28.97},{name:"Cairo",lat:30.04,lng:31.23},{name:"Mumbai",lat:19.07,lng:72.87},{name:"Dhaka",lat:23.81,lng:90.41},{name:"Beijing",lat:39.9,lng:116.4},{name:"Osaka",lat:34.69,lng:135.5},{name:"Manila",lat:14.59,lng:120.98}]},a0={subtitle:"Everything you need to know before launching. Still unsure? Our team is one message away.",items:[{question:"How do I get a free plan?",answer:"Free plans are community rewards rather than a public tier — invite friends to our Discord and you can unlock one through our invite rewards. Hop into the server, check the rewards channel, and our team will set you up. No credit card is ever required."},{question:"What's the difference between Budget, Standard and Performance?",answer:"They differ by CPU and storage class. Budget runs on Ryzen 5 (4.2 GHz) for vanilla and light plugin servers. Standard uses Ryzen 7 (4.7 GHz) for plugin-heavy servers and modpacks. Performance runs top-bin Ryzen 9 (5.7 GHz) with Gen4 NVMe for large networks and the heaviest modpacks."},{question:"How much RAM do I actually need?",answer:"As a rough guide: 2–4 GB for vanilla or light plugins with up to 15 players, 6–8 GB for medium modpacks or 30+ players, and 12 GB or more for large modpacks and networks. If you're unsure, start smaller — upgrading is instant and never requires a migration."},{question:"Which languages can I host my Discord bot in?",answer:"We provide ready-made images for Node.js, Python, Java, Go, PHP and Lua, with Git deploys and auto-restart on every plan. If you need a runtime we don't list, ask on Discord — custom images are usually no problem."},{question:"Do you support games other than Minecraft?",answer:"Yes — our general game hosting plans cover titles like Rust, ARK, CS2, Garry's Mod, Valheim, Palworld and more. If the server software runs on Linux, we can usually host it, so just ask."},{question:"Can I buy a domain from you?",answer:"We register a curated set of popular TLDs including .com, .in, .xyz, .fun and more, all with free WHOIS privacy and full DNS control — including SRV records so players can join your Minecraft server without typing a port."}]},i0=[{name:"Terms of Service",href:"/terms-of-services",description:"Our service agreement and usage terms"},{name:"Privacy Policy",href:"/privacy-policy",description:"How we handle and protect your data"}],N2={"terms-of-services":{title:"Terms of Service",updated:"Last updated: August 2026",intro:"These Terms of Service govern your use of NexifyHost services, infrastructure and related products. By creating an account, purchasing a service or continuing to use our infrastructure, you agree to these terms.",sections:[{heading:"1. Services",paragraphs:["NexifyHost provides Minecraft server hosting, Discord bot hosting, game server hosting, VPS and dedicated infrastructure, domain registration and related digital services.","Services are provisioned according to the specifications displayed at the time of purchase. NexifyHost may improve, upgrade, reconfigure or migrate infrastructure when necessary, provided that the core service specifications are not materially reduced.","Services are provided on an as-is and as-available basis. Infrastructure, availability and features may change as NexifyHost maintains and improves its systems."]},{heading:"2. Account Responsibility",paragraphs:["You are responsible for keeping your account credentials, passwords, API keys, SSH keys and other authentication information secure.","You are responsible for all activity performed through your account and services, including activity performed by sub-users or other people to whom you provide access.","You must provide accurate registration information and keep it reasonably up to date. Accounts are non-transferable unless explicitly approved by NexifyHost."]},{heading:"3. Infrastructure Integrity & Acceptable Use",paragraphs:["You may not use NexifyHost infrastructure in a manner that intentionally compromises, destabilizes or interferes with the infrastructure or services of NexifyHost or other customers.","Unauthorized resource saturation, network manipulation, intentional service overloading, hypervisor exploitation, resource-limit bypassing or similar activity is prohibited.","You may not use the service to host malware, phishing systems, botnet command-and-control infrastructure, DDoS scripts, malicious traffic systems, unauthorized cryptomining or other harmful software.","Pirated, nulled, leaked, cracked or otherwise unauthorized software and illegal assets are prohibited.","Activities designed to bypass execution limits, resource restrictions or platform controls are prohibited."]},{heading:"4. Fair Resource Usage",paragraphs:["Shared infrastructure operates under a fair-share resource model. Customers must use CPU, RAM, disk I/O and network resources reasonably within the capabilities of their purchased service.","Disproportionate CPU usage, excessive disk I/O, network congestion, memory leaks, automated loops or poorly optimized configurations that negatively affect shared infrastructure may result in throttling, isolation or suspension.","Customers may be required to optimize harmful mods, entities, plugins, configurations or workloads after receiving a warning."]},{heading:"5. Network & Security Restrictions",paragraphs:["Open mail relays, spam infrastructure, unauthorized open proxies, malicious proxy farms, packet flooding, network scanning and similar abusive network activity are prohibited.","Customers may not manipulate BGP routing, intentionally abuse IP reputation, bypass network security controls or use infrastructure to conduct unauthorized attacks.","Grey-hat scraping, proxy operations or similar high-risk activity may require prior verification and written authorization.","An IP address or service associated with malicious traffic, spam, attacks or other serious abuse may be isolated or suspended."]},{heading:"6. Commercial Use & Redistribution",paragraphs:["Subleasing, white-labeling, redistribution or reselling NexifyHost services is prohibited unless specifically authorized through a separate agreement.","Commercial self-promotion, unsolicited external links, portfolio distribution and B2B solicitation through NexifyHost communities or infrastructure require appropriate authorization.","Unsolicited direct messages targeting NexifyHost customers, staff or personnel are prohibited. Partnerships and cross-promotional activities should be coordinated through NexifyHost management."]},{heading:"7. Support & Service Triage",paragraphs:["Technical, billing and service issues must be submitted through the official NexifyHost support or ticket system.","Customers should not bypass established support channels by directly contacting engineers or other staff members for operational requests.","Support requests are handled according to severity, service impact and applicable contractual or service-level priority."]},{heading:"8. Service Availability & Maintenance",paragraphs:["NexifyHost may perform maintenance, upgrades, migrations, emergency repairs and infrastructure changes when necessary.","Where reasonably possible, planned maintenance may be communicated through appropriate service channels.","NexifyHost does not guarantee uninterrupted availability unless a specific service-level agreement explicitly provides otherwise."]},{heading:"9. Payments & Currency",paragraphs:["Customers are responsible for paying all applicable service charges, taxes and other fees associated with their purchases.","NexifyHost may operate using a primary billing currency. Customers are responsible for exchange-rate differences, bank charges, intermediary fees, remittance costs and applicable taxes.","International payment methods may involve gateway, cross-border or foreign-exchange costs. Where an approved international refund is issued, applicable processing or conversion costs may be deducted.","Volatile, restricted or otherwise high-risk payment mechanisms may be subject to additional conditions and may be considered final where disclosed before payment."]},{heading:"10. Refund Policy",paragraphs:["NexifyHost services are generally non-refundable after provisioning or engineering work has begun, except where a refund is specifically permitted under the applicable refund guidelines.","Change of mind, budget changes, failure to use a service or dissatisfaction with a customer's own configuration do not automatically qualify for a refund.","Dedicated servers, VPS services, domains and other operational services may be non-refundable once successfully provisioned and confirmed operational.","Custom development, technical provisioning, modpacks, plugins, configuration work, commercial add-ons, licensing keys and intellectual-property-related work may become non-refundable once engineering or fulfillment begins.","For eligible shared Minecraft hosting, application hosting and bot hosting services, refund requests may be considered within the applicable refund window where a significant issue caused by NexifyHost prevents normal service operation.","Third-party infrastructure outages, customer configuration problems, abuse violations and customer-caused issues generally do not qualify for refunds.","Approved refunds or service credits may require several business days to process depending on the payment provider.","Customers should contact NexifyHost support before initiating a payment dispute or chargeback. Unauthorized chargebacks may result in service termination and forfeiture of associated services or data."]},{heading:"11. Abuse & Service Suspension",paragraphs:["NexifyHost may temporarily isolate, throttle or suspend services involved in resource abuse, malicious activity, network attacks or activities that threaten infrastructure stability.","Examples include automated overload loops, memory abuse, cryptocurrency mining, packet flooding, unauthorized scanning, phishing, malicious traffic and attempts to bypass platform restrictions.","Serious or malicious activity may result in immediate service decommissioning without a recovery guarantee."]},{heading:"12. Intellectual Property & Legal Compliance",paragraphs:["Customers must have appropriate rights, licenses and permissions for all software, files, content and intellectual property hosted on NexifyHost infrastructure.","Piracy, copyright infringement, leaked software, nulled products, unauthorized distribution and intellectual-property theft are prohibited.","Valid legal, copyright, DMCA or cybersecurity claims may result in temporary suspension while NexifyHost investigates the matter.","Customers are responsible for complying with applicable laws and regulations relating to their hosted content and activities."]},{heading:"13. Service Expiration & Data Deletion",paragraphs:["Services may be suspended when an invoice expires or a renewal payment fails.","Suspended Minecraft, bot and development workspaces may be retained for up to 48 hours after suspension.","VPS and dedicated infrastructure backups may be retained for up to 72 hours.","After the applicable retention period expires, data may be permanently and unrecoverably deleted.","Customers are responsible for maintaining independent backups of important data."]},{heading:"14. Age & Account Eligibility",paragraphs:["Account owners must generally be at least 16 years old or have the legal capacity required to enter into the applicable agreement.","Where minors use services with parental or guardian involvement, the responsible parent or guardian must ensure compliance with these terms.","False registration information, fraudulent credentials or identity misrepresentation may result in account closure."]},{heading:"15. Administrative Rights",paragraphs:["NexifyHost reserves the right to deny, cancel, restrict or refuse service where necessary to protect its infrastructure, users, staff or business operations.","Where termination occurs without customer fault, NexifyHost may provide applicable prorated credit and a limited period for database or service-data export where technically possible.","Severe threats, harassment, abuse or serious misconduct toward staff may result in immediate termination and loss of the normal retrieval window."]},{heading:"16. Third-Party Services",paragraphs:["NexifyHost may rely on third-party payment processors, domain registries, infrastructure providers, network providers and other service providers.","Third-party outages or failures outside NexifyHost's reasonable control may affect service availability and may not qualify for refunds or compensation."]},{heading:"17. Limitation of Liability",paragraphs:["NexifyHost is not responsible for indirect, incidental, consequential or secondary losses, including loss of revenue, business opportunities, project value or expected profits.","Services are provided as-is and as-available unless a separate written agreement states otherwise.","To the maximum extent permitted by applicable law, NexifyHost's aggregate liability for an affected service is limited to the direct amount paid for that service during the applicable current monthly billing interval."]},{heading:"18. Customer Indemnification",paragraphs:["Customers are responsible for their own content, applications, configurations and activities and agree to indemnify NexifyHost against claims, losses or liabilities arising from their unlawful activity, violation of these terms or infringement of third-party rights."]},{heading:"19. Terms Changes",paragraphs:["NexifyHost may update these Terms of Service when necessary to reflect changes in services, infrastructure, legal requirements or operational policies.","Continued use of NexifyHost services after an updated version becomes effective constitutes acceptance of the revised terms where permitted by applicable law."]},{heading:"20. Governing Rules & Support",paragraphs:["Customers are expected to comply with applicable laws, Discord Terms of Service and Discord Community Guidelines when using NexifyHost-related communities or services.","Questions regarding these terms, billing, refunds or service disputes should be submitted through the official NexifyHost support ticket system."]}]},"privacy-policy":{title:"Privacy Policy",updated:"Last updated: August 2026",intro:"This Privacy Policy explains what information NexifyHost collects, why it is collected, how it is used and the choices available to customers regarding their information.",sections:[{heading:"1. Information We Collect",paragraphs:["Account information may include your email address, username, account identifiers and securely stored authentication information such as hashed passwords.","Billing information may include transaction references and billing details required by payment processors. Full payment-card numbers are not stored directly on NexifyHost servers when payment processing is handled by external payment providers.","For domain registrations, we may collect registrant information required by the applicable domain registry.","Operational information may include server resource metrics, panel actions, service logs, security logs and technical information required to operate and support your services."]},{heading:"2. How We Use Information",paragraphs:["We use collected information to create accounts, provision and maintain services, process payments, provide customer support, prevent fraud and abuse, maintain infrastructure security and communicate essential service information.","Technical logs and resource information may be used to troubleshoot incidents, investigate abuse and maintain infrastructure reliability.","If you participate in Discord invite rewards or similar programs, we may process your Discord username and invite counts solely for eligibility verification and administration."]},{heading:"3. Data Sharing",paragraphs:["NexifyHost does not sell personal data.","Information may be shared with service providers that are necessary to operate the service, including payment gateways, domain registries, fraud-prevention providers, infrastructure providers and other operational processors.","Information may also be disclosed when required by applicable law, court order, legal process or where reasonably necessary to protect users, staff, infrastructure or network security."]},{heading:"4. Data Processing & Privacy Responsibilities",paragraphs:["Where customers process personal information through their own hosted applications, the customer is responsible for determining the appropriate legal basis, notices, permissions and security measures required by applicable privacy laws.","Depending on the service and applicable law, NexifyHost may act as a data processor or service provider while the customer remains responsible for the data and purposes of processing within their application.","Customers processing personal information are responsible for complying with applicable privacy laws, which may include GDPR, CCPA or other regional data-protection requirements."]},{heading:"5. Data Security",paragraphs:["NexifyHost takes reasonable operational and technical measures to protect information and infrastructure against unauthorized access, misuse and security incidents.","Customers are responsible for securing their own applications, directories, databases, passwords, API keys and SSH credentials.","NexifyHost is not responsible for data loss or compromise caused by insecure customer applications, unpatched software, vulnerable plugins, exposed credentials or compromised customer accounts.","Customers operating critical production services should maintain independent and off-site backups."]},{heading:"6. Logs & Operational Monitoring",paragraphs:["NexifyHost may maintain technical, security and operational logs necessary to provide services, troubleshoot incidents, detect abuse and protect the network.","Server resource metrics and service activity may be reviewed when required for infrastructure management, security investigations, support or enforcement of the Terms of Service."]},{heading:"7. Data Retention",paragraphs:["Information may be retained for as long as reasonably necessary to provide services, maintain operational records, resolve disputes, comply with legal obligations and protect NexifyHost infrastructure.","When services expire or are terminated, service data may be retained for a limited recovery period before permanent deletion according to the applicable service retention policy.","Suspended Minecraft, bot and development workspaces may be retained for up to 48 hours, while VPS and dedicated infrastructure backups may be retained for up to 72 hours, after which data may be permanently deleted."]},{heading:"8. Government & Legal Requests",paragraphs:["NexifyHost may disclose or preserve information where required by valid legal process, government request, court order or applicable law.","Where legally permitted, NexifyHost may restrict, suspend or otherwise protect affected services while responding to lawful requests or investigating security and compliance matters."]},{heading:"9. Third-Party Processors",paragraphs:["Third-party providers may process information on NexifyHost's behalf for services such as payment processing, domain registration, infrastructure, fraud prevention, communications and security.","These providers may have their own privacy policies and contractual obligations governing how information is handled."]},{heading:"10. Customer Security Responsibilities",paragraphs:["Customers must protect passwords, SSH keys, database credentials, API tokens and other sensitive authentication information.","Customers should promptly report suspected account compromise or unauthorized access through the official support system.","NexifyHost may restrict or throttle applications that present a significant security or infrastructure risk while an incident is investigated."]},{heading:"11. International Data & Infrastructure",paragraphs:["Depending on the service, infrastructure and third-party provider involved, information may be processed or stored in different countries or regions.","Customers are responsible for ensuring that their own use of hosted services complies with applicable data-transfer, privacy and regulatory requirements."]},{heading:"12. Your Choices",paragraphs:["Customers may contact NexifyHost through the official support system regarding questions about account information, service data or privacy-related matters.","Some information may need to be retained where required for billing, security, legal compliance, fraud prevention or legitimate operational purposes."]},{heading:"13. Privacy Policy Changes",paragraphs:["NexifyHost may update this Privacy Policy when its services, data-processing practices or legal requirements change.","The latest version published on the NexifyHost website will represent the current Privacy Policy."]}]}},s0={tagline:"Premium Minecraft hosting, Discord bot hosting, game servers and domains — built for communities of every size.",columns:[{title:"Hosting",links:[{label:"Minecraft — Budget",href:"/minecraft/budget"},{label:"Minecraft — Standard",href:"/minecraft/standard"},{label:"Minecraft — Performance",href:"/minecraft/performance"},{label:"Discord Bot Hosting",href:"/bots"},{label:"Game Servers",href:"/gameservers"},{label:"Domains",href:"/domains"}]},{title:"Company",links:[{label:"Server Status",href:Ne.statusPage},{label:"Control Panel",href:Ne.gamePanel},{label:"Discord Community",href:Ne.discord},{label:"Free Plans (Invites)",href:Ne.discord}]},{title:"Legal",links:[{label:"Terms of Service",href:"/terms-of-services"},{label:"Privacy Policy",href:"/privacy-policy"},{label:"Refund Policy",href:"/terms-of-services"},{label:"Fair Usage",href:"/terms-of-services"}]}]};function M2({visible:a,onClose:s}){return a?f.jsx("div",{className:"fixed top-0 left-0 right-0 z-[60] bg-gradient-to-r from-blue-700 via-blue-600 to-blue-700 text-white text-sm",children:f.jsxs("div",{className:"max-w-7xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3",children:[f.jsxs("div",{className:"flex-1 flex items-center justify-center gap-2.5",children:[f.jsx("span",{className:"w-5 h-5 rounded-full bg-white/15 border border-white/25 flex items-center justify-center flex-shrink-0",children:f.jsx(s2,{
