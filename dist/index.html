    <script>
      /* Auto theme: apply before first paint to avoid a flash.
         Stored choice wins; otherwise follow the OS preference. */
      (function () {
        try {
          var t = localStorage.getItem("nexify-theme");
          var dark = t
            ? t === "dark"
            : !window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();

or their actions."]},{heading:"3. Acceptable Use",paragraphs:["You may not use our services for anything unlawful, including hosting malware, phishing pages, botnet command-and-control, unsolicited bulk email, or content that infringes the rights of others.","Resource abuse that degrades service for other customers — including cryptocurrency mining or running workloads unrelated to your plan type — may lead to suspension."]},{heading:"4. Free Plans & Invite Rewards",paragraphs:["Free plans are granted as community rewards, typically through Discord invite milestones, and remain at our discretion. They carry no uptime guarantee and receive community-level support.","Abusing the reward system — including fake invites, alt accounts or self-invites — voids eligibility and may result in removal of the free service. Upgrading to a paid plan is instant and preserves your data."]},{heading:"5. Payments & Refunds",paragraphs:["Paid services are billed in advance on a monthly cycle. Prices are set in INR; other currencies shown on the site are indicative conversions and the final charge is processed in INR.","First-time orders are eligible for a refund request within 72 hours of provisioning. Domain registrations, renewals and upgrades are non-refundable."]},{heading:"6. Domains",paragraphs:["Domain registrations are subject to the policies of the relevant registry and ICANN where applicable. You are responsible for providing accurate registrant details and for renewing before expiry.","We register only the TLDs listed on our domains page. Transfers in and out are supported subject to standard registry lock periods."]},{heading:"7. Service Level",paragraphs:["We target 99.9% monthly uptime for network and power on paid plans. Unplanned outages below this target may be eligible for service credit on request.","Scheduled maintenance is announced in advance on our status page and Discord, and does not count toward downtime calculations."]},{heading:"8. Termination & Liability",paragraphs:["You may cancel at any time from the client area; services remain active until the end of the paid period. We may suspend or terminate services immediately for violation of these terms or abuse reports.","Services are provided 'as is'. Our total liability for any claim is limited to the amounts you paid for the affected service in the 3 months preceding the event."]}]},"privacy-policy":{title:"Privacy Policy",updated:"Last updated: January 2026",intro:"This policy explains what information NexifyHost collects, why we collect it, and the choices you have. We keep it as short and readable as we legally can.",sections:[{heading:"1. Data We Collect",paragraphs:["Account data: your email address, username and hashed password. Billing data: transaction references and the billing details required by our payment processors — full card numbers never touch our servers.","For domain registrations we collect the registrant details required by the registry. Usage data: server resource metrics, panel actions and log files needed to operate and support your services."]},{heading:"2. How We Use It",paragraphs:["We use collected data to provision and maintain your services, process payments, prevent abuse, respond to support requests, and send essential service communications such as maintenance notices.","If you participate in Discord invite rewards, we process your Discord username and invite counts solely to verify eligibility."]},{heading:"3. Sharing",paragraphs:["We do not sell personal data. Data is shared only with the processors strictly needed to run the service — payment gateways, domain registries, fraud-prevention tools and infrastructure providers.","We may disclose information where required by law, court order, or to protect the safety of our users and network."]},{heading:"4. Retention",paragraphs:["Account data is retained while your account is active. Server contents are deleted following termination as described in our Terms of Service, and backups rotate out within 30 days.","Minimal billing and domain records are kept for the period required by applicable law and registry rules."]},{heading:"5. Security",paragraphs:["We protect data with TLS encryption in transit, encryption and strict access controls at rest, isolated service containers, and mandatory two-factor authentication for staff systems.","No system is perfectly secure; if a breach affects your data we will notify you without undue delay."]},{heading:"6. Your Rights",paragraphs:["You may access, correct or export your account data at any time from the client area, and request deletion of your account by contacting support.","Depending on your jurisdiction you may have additional rights, including to object to processing or lodge a complaint with a supervisory authority."]},{heading:"7. Cookies",paragraphs:["We use essential cookies for authentication and preferences (like your theme and currency choice), and privacy-respecting aggregate analytics. You can block non-essential cookies without losing core functionality."]},{heading:"8. Contact",paragraphs:["Questions about this policy or your data? Reach us anytime on Discord or through a support ticket — a real engineer will respond."]}]}},Bs={tagline:"Premium Minecraft hosting, Discord bot hosting, game servers and domains — built for communities of every size.",closingTitle:"Infrastructure you can build on.",closingText:"From a first private server to a growing public community, NexifyHost delivers dependable performance, transparent pricing and responsive technical support at every stage.",trademarkNotice:"NexifyHost is an independent hosting provider and is not affiliated with Mojang Studios, Microsoft or Discord Inc. All product names and trademarks belong to their respective owners.",columns:[{title:"Hosting",links:[{label:"Minecraft — Budget",href:"/minecraft/budget"},{label:"Minecraft — Standard",href:"/minecraft/standard"},{label:"Minecraft — Performance",href:"/minecraft/performance"},{label:"Di
