        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();

aft server without typing a port."}]},ai={badge:"Trust Center",title:"Live Service",accent:"Status",subtitle:"Real-time availability across every layer of our platform. This page refreshes automatically and is powered by the same probes that page our on-call engineers.",refreshSeconds:30,services:[{id:"panel",name:"Game Panel",desc:"Dashboard, console & shell access",uptime:"99.98%",latency:42,seed:3},{id:"mc",name:"Minecraft Nodes",desc:"Budget · Standard · Performance fleets",uptime:"99.95%",latency:38,seed:7},{id:"bots",name:"Bot Hosting Nodes",desc:"Always-on Discord bot workers",uptime:"99.91%",latency:51,seed:11},{id:"games",name:"Game Server Nodes",desc:"Dockerized multi-game runtimes",uptime:"99.97%",latency:44,seed:17},{id:"dns",name:"Domains & DNS",desc:"Registrar, DNS zones & SSL issuance",uptime:"100.0%",latency:23,seed:23},{id:"api",name:"Public API & Billing",desc:"Client API, orders & provisioning",uptime:"99.99%",latency:35,seed:29}],regions:[{name:"Mumbai Edge",ms:11},{name:"Singapore Edge",ms:38},{name:"Frankfurt Core",ms:92},{name:"New York Core",ms:138},{name:"São Paulo Edge",ms:196}],incidents:[{date:"Jan 20, 2026",title:"Scheduled migration — node MC-EU-03",body:"Kernel and NVMe driver upgrade on one Frankfurt Minecraft node. Zero-downtime live migration was executed across a two-hour maintenance window.",tag:"Maintenance",tone:"amber"},{date:"Jan 12, 2026",title:"Bot worker restart loop after faulty deploy",body:"A runtime image caused repeated restarts on a subset of bot hosting workers. Rollback completed in 45 minutes; no bot data or configurations were affected.",tag:"Resolved",tone:"emerald"},{date:"Dec 28, 2025",title:"Upstream DDoS filtering flapping",body:"One transit provider briefly re-routed around our edge filters. Mitigation engaged automatically and connectivity normalized within 18 minutes.",tag:"Mitigated",tone:"emerald"}]},$t={badge:"Panel Store",title:"Blueprints &",accent:"Extensions",subtitle:"Production-grade extensions for our game panel — hand-built, security reviewed and tuned to work together. Install once and our team keeps them compatible with every panel release.",note:"All extension prices are listed in USD and are one-time purchases.",categories:[{id:"ux",name:"UI, UX & Presentation",tagline:"Thirteen focused upgrades that make the panel feel like a native product.",accent:"#2563EB",items:[{icon:"table",name:"Blue Tables UI Modifier",price:3,desc:"Responsive blue-accent table theme with sticky headers, zebra rows and compact mode."},{icon:"brush",name:"Custom CSS Injection Tool",price:4,desc:"Inject scoped stylesheets safely, with live preview, versioning and one-click rollback."},{icon:"code",name:"Monaco Advanced Code Editor",price:5.5,desc:"Upgrade every file editor to Monaco with IntelliSense, minimap and multi-cursor editing."},{icon:"infinity",name:"No-Pagination Endless Scrolling",price:3.5,desc:"Seamless infinite scroll in place of pagination — filters keep their live context."},{icon:"users",name:"Player Listing Displays",price:4,desc:"Real-time online player cards with avatars, ping and session duration."},{icon:"package",name:"Pteromonaco Code Suite",price:5,desc:"Monaco plus tabbed editing, syntax themes and editor code actions, bundled."},{icon:"image",name:"Dynamic Server Backgrounds",price:3,desc:"Animated, server-aware ambient backgrounds for the dashboard and login screen."},{icon:"sidebar",name:"Sidebar Navigation Customizer",price:3.5,desc:"Drag to reorder, pin and group sidebar navigation per user profile."},{icon:"star",name:"Simple Favicon Manager",price:2,desc:"Upload and swap panel favicons with instant CDN cache invalidation."},{icon:"footer",name:"Simple Footer Editor",price:2.5,desc:"Edit footer text, links and legal rows from the admin UI — zero code changes."},{icon:"snowflake",name:"Snowflake Particle Overlay",price:2,desc:"Configurable seasonal particle overlays with density and drift controls."},{icon:"rocket",name:"Startup Changer Utility",price:3.5,desc:"Switch between pre-built startup command profiles per game version in one click."},{icon:"chart",name:"Static & Panel Statistics Views",price:4.5,desc:"Embeddable TPS, players and uptime widgets for the panel or external sites."}]},{id:"auth",name:"Authentication, Integrations & Routing",tagline:"Deeper platform capabilities — identity, chat, alerts and network automation.",accent:"#8B5CF6",items:[{icon:"key",name:"Discord Authentication Blueprint",price:12,desc:"Full OAuth2 Discord SSO with role-based permissions and guild membership validation.",flagship:!0},{icon:"shield",name:"Social OAuth Secure Login",price:8,desc:"Google and GitHub sign-in with MFA-ready session management."},{icon:"chat",name:"Tawk.to Live Chat Integration",price:4.5,desc:"Embed Tawk.to with authenticated user context passed straight into tickets."},{icon:"redirect",name:"Domain & Network Redirector",price:4,desc:"Smart multi-domain redirects with path preservation and SSL handling."},{icon:"bell",name:"Resource Threshold Alerts",price:5.5,desc:"CPU, RAM and disk alerts delivered via panel notifications and webhooks."},{icon:"globe",name:"Network Subdomain Manager",price:7.5,desc:"Bulk-create, assign and release SRV and A records tied to allocations."},{icon:"map",name:"Subdomains Mapping Matrix",price:6,desc:"Visual map of every subdomain to its server, port and ownership state."},{icon:"languages",name:"CoreSystem Translations Module",price:9,desc:"Panel-wide i18n with per-user locales, crowd-editable packs and RTL support."}]}],licensing:{title:"One license, forever",body:"Every extension and module includes a permanent, non-expiring license for the purchased component. No recurring license renewal is required."}},I2=[{name:"Terms of Service",href:"/terms-of-services",description:"Our service agreement and usage terms"},{name:"Privacy Policy",href:"/privacy-policy",description:"How we handle and protect your data"}],_b={"terms-of-services":{title:"Terms of Service",updated:"Last updated: January 2026",intro:"These terms govern your use of NexifyHost services. By creating an account or ordering a service, you agree to everything below — please read it carefully.",sections:[{heading:"1. Services",paragraphs:["NexifyHost provides Minecraft server hosting, Discord bot hosting, general game server hosting and domain registration. Services are provisioned automatically with the specifications shown at the time of order.","We may improve, upgrade or reconfigure infrastructure at any time, provided your service specifications are not materially reduced."]},{heading:"2. Accounts",paragraphs:["You are responsible for keeping your account credentials confidential and for everything that happens under your account. You must provide accurate information when registering and keep it up to date.","Accounts are non-transferable. You may add sub-users to your panel at your own discretion and remain responsible for their actions."]},{heading:"3. Acceptable Use",paragraphs:["You may not use our services for anything unlawful, including hosting malware, phishing pages, botnet command-and-control, unsolicited bulk email, or content that infringes the rights of others.","Resource abuse that degrades service for other customers — including cryptocurrency mining or running workloads unrelated to your plan type — may lead to suspension."]},{heading:"4. Free Plans & Invite Rewards",paragraphs:["Free plans are granted as community rewards, typically through Discord invite milestones, and remain at our discretion. They carry no uptime guarantee and receive community-level support.","Abusing the reward system — including fake invites, alt accounts or self-invites — voids eligibility and may result in removal of the free service. Upgrading to a paid plan is instant and preserves your data."]},{heading:"5. Payments & Refunds",paragraphs:["Paid services are billed in advance on a monthly cycle. Prices are set in INR; other currencies shown on the site are indicative conversions and the final charge is processed in INR.","First-time orders are eligible for a refund request within 72 hours of provisioning. Domain registrations, renewals and upgrades are non-refundable."]},{heading:"6. Domains",paragraphs:["Domain registrations are subject to the policies of the relevant registry and ICANN where applicable. You are responsible for providing accurate registrant details and for renewing before expiry.","We register only the TLDs listed on our domains page. Transfers in and out are supported subject to standard registry lock periods."]},{heading:"7. Service Level",paragraphs:["We target 99.9% monthly uptime for network and power on paid plans. Unplanned outages below this target may be eligible for service credit on request.","Scheduled maintenance is announced in advance on our status page and Discord, and does not count toward downtime calculations."]},{heading:"8. Termination & Liability",paragraphs:["You may cancel at any time from the client area; services remain active until the end of the paid period. We may suspend or terminate services immediately for violation of these terms or abuse reports.","Services are provided 'as is'. Our total liability for any claim is limited to the amounts you paid for the affected service in the 3 months preceding the event."]}]},"privacy-policy":{title:"Privacy Policy",updated:"Last updated: January 2026",intro:"This policy explains what information NexifyHost collects, why we collect it, and the choices you have. We keep it as short and readable as we legally can.",sections:[{heading:"1. Data We Collect",paragraphs:["Account data: your email address, username and hashed password. Billing data: transaction references and the billing details required by our payment processors — full card numbers never touch our servers.","For domain registrations we collect the registrant details required by the registry. Usage data: server resource metrics, panel actions and log files needed to operate and support your services."]},{heading:"2. How We Use It",paragraphs:["We use collected data to provision and maintain your services, process payments, prevent abuse, respond to support requests, and send essential service communications such as maintenance notices.","If you participate in Discord invite rewards, we process your Discord username and invite counts solely to verify eligibility."]},{heading:"3. Sharing",paragraphs:["We do not sell personal data. Data is shared only with the processors strictly needed to run the service — payment gateways, domain registries, fraud-prevention tools and infrastructure providers.","We may disclose information where required by law, court order, or to protect the safety of our users and network."]},{heading:"4. Retention",paragraphs:["Account data is retained while your account is active. Server contents are deleted following termination as described in our Terms of Service, and backups rotate out within 30 days.","Minimal billing and domain records are kept for the period required by applicable law and registry rules."]},{heading:"5. Security",paragraphs:["We protect data with TLS encryption in transit, encryption and strict access controls at rest, isolated service containers, and mandatory two-factor authentication for staff systems.","No system is perfectly secure; if a breach affects your data we will notify you without undue delay."]},{heading:"6. Your Rights",paragraphs:["You may access, correct or export your account data at any time from the client area, and request deletion of your account by contacting support.","Depending on your jurisdiction you may have additional rights, including to object to processing or lodge a complaint with a supervisory authority."]},{heading:"7. Cookies",paragraphs:["We use essential cookies for authentication and preferences (like your theme and currency choice), and privacy-respecting aggregate analytics. You can block non-essential cookies without losing core functionality."]},{heading:"8. Contact",paragraphs:["Questions about this policy or your data? Reach us anytime on Discord or through a support ticket — a real engineer will respond."]}]}},zs={tagline:"Premium Minecraft hosting, Discord bot hosting, game servers and domains — built for communities of every size.",closingTitle:"Infrastructure you can build on.",closingText:"From a first private server to a growing public community, NexifyHost delivers dependable performance, transparent pricing and responsive technical support at every stage.",trademarkNotice:"NexifyHost is an independent hosting provider and is not affiliated with Mojang Studios, Microsoft or Discord Inc. All product names and trademarks belong to their respective owners.",columns:[{title:"Hosting",links:[{label:"Minecraft — Budget",href:"/minecraft/budget"},{label:"Minecraft — Standard",href:"/minecraft/standard"},{label:"Minecraft — Performance",href:"/minecraft/performance"},{label:"Discord Bot Hosting",href:"/bots"},{label:"Game Servers",href:"/gameservers"},{label:"Domains",href:"/domains"},{label:"Panel Extensions",href:"/extensions"}]},{title:"Company",links:[{label:"Server Status",href:me.statusPage},{label:"Discord Community",href:me.discord},{label:"Free Plans (Invites)",href:me.discord}]},{title:"Legal",links:[{label:"Terms of Service",href:"/terms-of-services"},{label:"Privacy Policy",href:"/privacy-policy"},{label:"Refund Policy",href:"/terms-of-services"},{label:"Fair Usage",href:"/terms-of-services"}]}]};function Ob({visible:i,onClose:s}){return i?u.jsx("div",{className:"fixed top-0 left-0 right-0 z-[60] bg-gradient-to-r from-blue-700 via-blue-600 to-blue-700 text-white text-sm",children:u.jsxs("div",{className:"max-w-7xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3",children:[u.jsxs("div",{className:"flex-1 flex items-center justify-center gap-2.5",children:[u.jsx("span",{className:"w-5 h-5 rounded-full bg-white/15 border border-white/25 flex items-center justify-center flex-shrink-0",children:u.js
