<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="dnsky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04121f"/>
      <stop offset="1" stop-color="#0a3b5c"/>
    </linearGradient>
    <radialGradient id="dnglow" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dnglobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#dnsky)"/>
  <circle cx="640" cy="330" r="300" fill="url(#dnglow)"/>

  <!-- globe -->
  <g>
    <circle cx="640" cy="330" r="190" fill="url(#dnglobe)" stroke="#22d3ee" stroke-width="4"/>
    <!-- lat/long grid -->
    <g fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.5">
      <path d="M450 330h380"/>
      <path d="M470 250c100 40 240 40 340 0"/>
      <path d="M470 410c100-40 240-40 340 0"/>
      <path d="M640 140c-90 100-90 280 0 380"/>
      <path d="M640 140c90 100 90 280 0 380"/>
      <ellipse cx="640" cy="330" rx="90" ry="190"/>
    </g>
    <!-- land hints -->
    <g fill="#0891b2" opacity="0.8">
      <rect x="540" y="230" width="60" height="34" rx="8"/>
      <rect x="680" y="300" width="80" height="40" rx="10"/>
      <rect x="560" y="360" width="66" height="30" rx="8"/>
      <rect x="700" y="230" width="46" height="26" rx="7"/>
    </g>
  </g>

  <!-- orbit ring -->
  <ellipse cx="640" cy="330" rx="330" ry="110" fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="4 14" opacity="0.7"/>

  <!-- TLD nodes on orbit -->
  <g font-family="Arial,sans-serif" font-weight="800" font-size="30">
    <g transform="translate(340 300)">
      <rect x="0" y="-38" width="120" height="56" rx="14" fill="#0b3247" stroke="#67e8f9" stroke-width="3"/>
      <text x="60" y="0" text-anchor="middle" fill="#a5f3fc">.com</text>
    </g>
    <g transform="translate(760 190)">
      <rect x="0" y="-38" width="96" height="56" rx="14" fill="#0b3247" stroke="#67e8f9" stroke-width="3"/>
      <text x="48" y="0" text-anchor="middle" fill="#a5f3fc">.in</text>
    </g>
    <g transform="translate(960 320)">
      <rect x="0" y="-38" width="104" height="56" rx="14" fill="#0b3247" stroke="#67e8f9" stroke-width="3"/>
      <text x="52" y="0" text-anchor="middle" fill="#a5f3fc">.xyz</text>
    </g>
    <g transform="translate(700 470)">
      <rect x="0" y="-38" width="108" height="56" rx="14" fill="#0b3247" stroke="#67e8f9" stroke-width="3"/>
      <text x="54" y="0" text-anchor="middle" fill="#a5f3fc">.fun</text>
    </g>
    <g transform="translate(380 480)">
      <rect x="0" y="-38" width="116" height="56" rx="14" fill="#0b3247" stroke="#67e8f9" stroke-width="3"/>
      <text x="58" y="0" text-anchor="middle" fill="#a5f3fc">.net</text>
    </g>
  </g>

  <!-- data pulses -->
  <g fill="#a5f3fc">
    <circle cx="470" cy="330" r="6"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="190" r="6"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="350" r="6"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="495" r="6"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
