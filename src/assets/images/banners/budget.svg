<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a19"/>
      <stop offset="1" stop-color="#1f7a3f"/>
    </linearGradient>
    <linearGradient id="broof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3f14"/>
      <stop offset="1" stop-color="#52290c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bsky)"/>

  <!-- stars -->
  <g fill="#d9fbe6" opacity="0.7">
    <rect x="90" y="50" width="6" height="6"/><rect x="300" y="80" width="5" height="5"/><rect x="640" y="60" width="6" height="6"/><rect x="480" y="40" width="5" height="5"/>
  </g>

  <!-- hills -->
  <ellipse cx="150" cy="470" rx="280" ry="120" fill="#266d33"/>
  <ellipse cx="700" cy="480" rx="320" ry="130" fill="#1d5e2a"/>

  <!-- cabin -->
  <g>
    <rect x="330" y="250" width="150" height="110" fill="#8a5a2b"/>
    <path d="M315 252 405 168l90 84z" fill="url(#broof)"/>
    <rect x="386" y="300" width="36" height="60" fill="#3f2d14"/>
    <rect x="346" y="282" width="26" height="26" fill="#fde68a"/>
    <rect x="440" y="282" width="26" height="26" fill="#fde68a"/>
    <path d="M346 295h26M359 282v26M440 295h26M453 282v26" stroke="#8a5a2b" stroke-width="3"/>
  </g>

  <!-- voxel trees -->
  <g>
    <rect x="120" y="285" width="22" height="60" fill="#5b3a1a"/>
    <rect x="78" y="225" width="106" height="42" fill="#2f8f46"/>
    <rect x="98" y="192" width="66" height="38" fill="#3aa452"/>
    <rect x="610" y="300" width="20" height="55" fill="#5b3a1a"/>
    <rect x="572" y="248" width="96" height="38" fill="#2f8f46"/>
    <rect x="590" y="218" width="60" height="34" fill="#3aa452"/>
  </g>

  <!-- ground -->
  <rect y="360" width="800" height="90" fill="#2f7a3d"/>
  <path d="M0 360h800v8H0z" fill="#4d9e50"/>
  <g fill="#7ae582" opacity="0.5">
    <rect x="60" y="382" width="34" height="12"/><rect x="240" y="398" width="34" height="12"/><rect x="520" y="388" width="34" height="12"/><rect x="700" y="400" width="34" height="12"/>
  </g>

  <!-- path -->
  <path d="M405 360l-40 90h90l-40-90z" fill="#c9a877" opacity="0.85"/>

  <!-- coin hint of savings -->
  <g transform="translate(668 116)">
    <circle r="26" fill="#0e2a19" opacity="0.35" cx="4" cy="5"/>
    <circle r="26" fill="#22C55E"/>
    <text x="0" y="10" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#0e2a19">₹</text>
  </g>
</svg>
