    <rect x="920" y="350" width="180" height="26"/>
  </g>

  <!-- trees -->
  <g>
    <rect x="500" y="430" width="26" height="70" fill="#5b3a1a"/>
    <g fill="#2f6b1c">
      <rect x="442" y="360" width="142" height="52"/>
      <rect x="464" y="316" width="98" height="52"/>
    </g>
    <rect x="672" y="452" width="22" height="58" fill="#5b3a1a"/>
    <g fill="#3d7d24">
