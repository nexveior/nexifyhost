<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d33"/>
      <stop offset="0.55" stop-color="#123f63"/>
      <stop offset="1" stop-color="#1d5c3a"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d8c2b"/>
      <stop offset="1" stop-color="#2d5c17"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a97a5"/>
      <stop offset="1" stop-color="#525f6d"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="1010" cy="150" r="230" fill="url(#sun)"/>
  <rect x="960" y="118" width="100" height="100" fill="#fcd34d" opacity="0.9"/>

  <!-- stars -->
  <g fill="#e2e8f0" opacity="0.7">
    <rect x="120" y="90" width="6" height="6"/><rect x="330" y="60" width="5" height="5"/>
    <rect x="520" y="120" width="6" height="6"/><rect x="700" y="70" width="5" height="5"/>
    <rect x="240" y="170" width="5" height="5"/><rect x="840" y="120" width="6" height="6"/>
  </g>

  <!-- distant blocky mountains -->
  <g fill="url(#stone)" opacity="0.85">
    <rect x="0" y="430" width="180" height="150"/>
    <rect x="120" y="380" width="180" height="200"/>
    <rect x="240" y="430" width="160" height="150"/>
    <rect x="780" y="400" width="200" height="180"/>
    <rect x="920" y="350" width="180" height="230"/>
    <rect x="1040" y="410" width="240" height="170"/>
