  <rect y="560" width="1280" height="160" fill="url(#grass)"/>
  <g>
    <path d="M0 560h1280v10H0z" fill="#5aa534"/>
    <g fill="#79c94a" opacity="0.55">
      <rect x="40" y="590" width="42" height="16"/><rect x="210" y="620" width="42" height="16"/>
      <rect x="430" y="600" width="42" height="16"/><rect x="620" y="630" width="42" height="16"/>
      <rect x="820" y="600" width="42" height="16"/><rect x="1030" y="625" width="42" height="16"/>
      <rect x="1200" y="595" width="42" height="16"/><rect x="980" y="585" width="42" height="16"/>
    </g>
    <g fill="#6b4a22" opacity="0.9">
      <rect x="0" y="620" width="180" height="100" opacity="0.7"/>
      <rect x="500" y="640" width="160" height="80" opacity="0.6"/>
      <rect x="1000" y="625" width="200" height="95" opacity="0.7"/>
    </g>
