  <!-- castle village -->
  <g>
    <rect x="140" y="470" width="240" height="110" fill="#7c8a99"/>
    <rect x="116" y="420" width="70" height="160" fill="#8fa0b0"/>
    <rect x="334" y="420" width="70" height="160" fill="#8fa0b0"/>
    <g fill="#475569">
      <rect x="116" y="404" width="18" height="16"/><rect x="142" y="404" width="18" height="16"/><rect x="168" y="404" width="18" height="16"/>
      <rect x="334" y="404" width="18" height="16"/><rect x="360" y="404" width="18" height="16"/><rect x="386" y="404" width="18" height="16"/>
      <rect x="140" y="454" width="20" height="16"/><rect x="180" y="454" width="20" height="16"/><rect x="220" y="454" width="20" height="16"/><rect x="260" y="454" width="20" height="16"/><rect x="300" y="454" width="20" height="16"/><rect x="340" y="454" width="20" height="16"/>
    </g>
    <rect x="238" y="508" width="44" height="72" fill="#3f2d14"/>
    <rect x="208" y="522" width="22" height="26" fill="#fbbf24" opacity="0.85"/>
