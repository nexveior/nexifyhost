<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="gssky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100b26"/>
      <stop offset="1" stop-color="#3b1475"/>
    </linearGradient>
    <linearGradient id="gsrack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232f48"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <radialGradient id="gsglow" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#gssky)"/>
  <circle cx="400" cy="330" r="330" fill="url(#gsglow)"/>

  <!-- light trails -->
  <g stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M60 180c220-40 380 80 600 30" stroke="#60a5fa" stroke-width="4"/>
    <path d="M40 560c260 50 480-60 720 10" stroke="#c084fc" stroke-width="4"/>
    <path d="M720 600c180-20 320 60 500 10" stroke="#4ade80" stroke-width="3"/>
  </g>

  <!-- server racks -->
  <g transform="translate(120 120)">
    <!-- rack 1 -->
    <g>
      <rect width="230" height="390" rx="16" fill="url(#gsrack)" stroke="#3d4c6e" stroke-width="3"/>
      <g>
        <rect x="20" y="24" width="190" height="60" rx="8" fill="#1a2438" stroke="#3d4c6e"/>
        <rect x="20" y="100" width="190" height="60" rx="8" fill="#1a2438" stroke="#3d4c6e"/>
        <rect x="20" y="176" width="190" height="60" rx="8" fill="#1a2438" stroke="#3d4c6e"/>
        <rect x="20" y="252" width="190" height="60" rx="8" fill="#1a2438" stroke="#3d4c6e"/>
        <rect x="20" y="328" width="190" height="36" rx="8" fill="#1a2438" stroke="#3d4c6e"/>
      </g>
      <g fill="#a855f7">
        <circle cx="40" cy="54" r="7"/><circle cx="40" cy="130" r="7"/><circle cx="40" cy="206" r="7"/><circle cx="40" cy="282" r="7"/>
      </g>
      <g stroke="#47557a" stroke-width="5">
        <path d="M80 44h110M80 58h110M80 120h110M80 134h110M80 196h110M80 210h110M80 272h110M80 286h110M80 342h110"/>
      </g>
    </g>
    <!-- rack 2 (behind, shifted) -->
    <g transform="translate(280 50)" opacity="0.9">
      <rect width="230" height="340" rx="16" fill="url(#gsrack)" stroke="#3d4c6e" stroke-width="3"/>
      <g>
        <rect x="20" y="24" width="190" height="60" rx="8" fill="#1a2438" stroke="#3d4c6e"/>
        <rect x="20" y="100" width="190" height="60" rx="8" fill="#1a2438" stroke="#3d4c6e"/>
        <rect x="20" y="176" width="190" height="60" rx="8" fill="#1a2438" stroke="#3d4c6e"/>
        <rect x="20" y="252" width="190" height="60" rx="8" fill="#1a2438" stroke="#3d4c6e"/>
      </g>
      <g fill="#60a5fa">
        <circle cx="40" cy="54" r="7"/><circle cx="40" cy="130" r="7"/><circle cx="40" cy="206" r="7"/><circle cx="40" cy="282" r="7"/>
      </g>
      <g stroke="#47557a" stroke-width="5">
        <path d="M80 44h110M80 58h110M80 120h110M80 134h110M80 196h110M80 210h110M80 272h110M80 286h110"/>
      </g>
    </g>
  </g>

  <!-- controller -->
  <g transform="translate(830 330)">
    <rect width="300" height="150" rx="60" fill="#1b1235" stroke="#6d28d9" stroke-width="4"/>
    <path d="M70 45v60M40 75h60" stroke="#a855f7" stroke-width="12" stroke-linecap="round"/>
    <circle cx="200" cy="60" r="13" fill="#ef4444"/>
    <circle cx="236" cy="78" r="13" fill="#4ade80"/>
    <circle cx="200" cy="96" r="13" fill="#60a5fa"/>
    <circle cx="164" cy="78" r="13" fill="#fbbf24"/>
  </g>

  <!-- floating voxel cubes -->
  <g fill="#a855f7" opacity="0.85">
    <rect x="700" y="130" width="34" height="34" rx="6" transform="rotate(14 717 147)"/>
    <rect x="1130" y="120" width="26" height="26" rx="5" transform="rotate(-16 1143 133)"/>
    <rect x="940" y="620" width="30" height="30" rx="6" transform="rotate(10 955 635)"/>
  </g>
</svg>
