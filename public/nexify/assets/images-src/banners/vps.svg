<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="vpsSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040b1a"/>
      <stop offset="1" stop-color="#0a2a5c"/>
    </linearGradient>
    <radialGradient id="vpsGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#vpsSky)"/>
  <circle cx="640" cy="360" r="300" fill="url(#vpsGlow)"/>

  <!-- server rack silhouettes -->
  <g transform="translate(340 160)" fill="#1e293b" opacity="0.6">
    <rect width="600" height="400" rx="16" stroke="#334155" stroke-width="2"/>
    <g fill="#334155">
      <rect x="40" y="40" width="520" height="40" rx="4"/>
      <rect x="40" y="100" width="520" height="40" rx="4"/>
      <rect x="40" y="160" width="520" height="40" rx="4"/>
      <rect x="40" y="220" width="520" height="40" rx="4"/>
      <rect x="40" y="280" width="520" height="40" rx="4"/>
      <rect x="40" y="340" width="520" height="40" rx="4"/>
    </g>
    <!-- activity lights -->
    <g>
      <circle cx="60" cy="60" r="4" fill="#3b82f6"/>
      <circle cx="60" cy="120" r="4" fill="#10b981"/>
      <circle cx="60" cy="180" r="4" fill="#3b82f6"/>
      <circle cx="60" cy="240" r="4" fill="#3b82f6"/>
      <circle cx="60" cy="300" r="4" fill="#10b981"/>
      <circle cx="60" cy="360" r="4" fill="#3b82f6"/>
    </g>
  </g>

  <!-- digital cloud icons -->
  <g stroke="#3b82f6" stroke-width="3" fill="none" opacity="0.4">
    <path d="M100 200c0-30 25-55 55-55 40 0 55 30 55 30s20-15 40-15c30 0 50 25 50 55s-20 55-50 55H155c-30 0-55-25-55-55z"/>
    <path d="M1000 450c0-25 20-45 45-45 35 0 45 25 45 25s15-12 35-12c25 0 40 20 40 45s-15 45-40 45H1045c-25 0-45-20-45-45z"/>
